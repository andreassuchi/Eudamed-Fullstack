<tr>
  <td style="width:8rem">
    <select name="tn_language">
      {% for v in languages %}<option value="{{ v }}" {% if v == language %}selected{% endif %}>{{ v }}</option>{% endfor %}
    </select>
  </td>
  <td><input name="tn_text" placeholder="Trade name" value="{{ text }}"></td>
  <td style="width:2.5rem"><button type="button" class="secondary outline"
      onclick="this.closest('tr').remove()">✕</button></td>
</tr>
