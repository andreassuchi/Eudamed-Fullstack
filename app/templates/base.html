<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EUDAMED{% endblock %} — AS-Consult</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">AS-Consult <small>EUDAMED Registration</small></a>
  <nav class="topbar-links">
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
    <a href="/basic-udis" class="{{ 'active' if request.url.path.startswith('/basic-udis') else '' }}">Basic UDI-DIs</a>
    <a href="/devices" class="{{ 'active' if request.url.path.startswith('/devices') else '' }}">Devices</a>
    <a href="/import" class="{{ 'active' if request.url.path.startswith('/import') else '' }}">Import</a>
    <a href="/generation" class="{{ 'active' if request.url.path.startswith('/generation') else '' }}">Validate &amp; Generate</a>
    <a href="/backups" class="{{ 'active' if request.url.path.startswith('/backups') else '' }}">Backups</a>
  </nav>
</header>
<main class="page-main">
  <div class="page-frame">
    <div class="page-panel">
      {% block content %}{% endblock %}
    </div>
  </div>
</main>
<footer class="app-footer">EUDAMED Fullstack {{ app_version }} · DTX schema 3.0.30</footer>
</body>
</html>
