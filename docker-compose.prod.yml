# Production overlay for a public VPS (Debian 13 + Docker Engine).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences vs. the base docker-compose.yml:
#   * No host port is published for the app or the database. Only Caddy is
#     reachable from the network (80/443); everything else stays on the
#     internal compose network.
#   * Postgres credentials, the public domain and the login come from .env.prod
#     (never committed).
#   * A Caddy reverse proxy terminates TLS (free Let's Encrypt cert, auto-renew)
#     and enforces HTTP basic-auth in front of the app.
services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    # Override the base file's "5433:5432" mapping so the DB is NOT public.
    # (An empty list clears the ports inherited from docker-compose.yml.)
    ports: []
    restart: unless-stopped

  app:
    environment:
      EUDAMED_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EUDAMED_OUTPUT_DIR: /srv/eudamed/output
      EUDAMED_PROFILE: ${EUDAMED_PROFILE:-as-consult}
    # Not published to the host; only Caddy (same network) reaches it on :8000.
    ports: []
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      EUDAMED_DOMAIN: ${EUDAMED_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # issued certificates (persist across restarts)
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
