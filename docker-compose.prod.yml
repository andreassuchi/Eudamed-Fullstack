# Production stack for a VPS that ALREADY runs host nginx + certbot.
#
# This file is SELF-CONTAINED (do not combine with docker-compose.yml). The app
# is published only on 127.0.0.1 so it is NOT reachable from the internet
# directly; the host nginx reverse-proxies the public subdomain to it and
# terminates TLS. The database has no published port at all.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EUDAMED_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EUDAMED_OUTPUT_DIR: /srv/eudamed/output
      EUDAMED_PROFILE: ${EUDAMED_PROFILE:-as-consult}
    volumes:
      - ./output:/srv/eudamed/output
      - ./backups:/srv/eudamed/backups
    # Bind to localhost ONLY. Host nginx proxies to this; the port is never public.
    # Change 8090 if that port is already taken on the host.
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
