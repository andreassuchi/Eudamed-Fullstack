services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eudamed
      POSTGRES_PASSWORD: eudamed
      POSTGRES_DB: eudamed
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # host 5433: local EDB Postgres already owns 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudamed"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EUDAMED_DATABASE_URL: postgresql+psycopg://eudamed:eudamed@db:5432/eudamed
      EUDAMED_OUTPUT_DIR: /srv/eudamed/output
    volumes:
      - ./output:/srv/eudamed/output
      - ./backups:/srv/eudamed/backups
    ports:
      - "8090:8000"  # host 8090: 8080 is taken by EDB Postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
