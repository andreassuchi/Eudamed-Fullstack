# Playground stack (DTX 3.0.32 branch) — runs alongside production.
# Distinct project name keeps containers and the pgdata volume separate.
name: eudamed-playground

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eudamed
      POSTGRES_PASSWORD: eudamed
      POSTGRES_DB: eudamed
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # playground db (production uses 5433; 5432 is local EDB)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudamed"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EUDAMED_DATABASE_URL: postgresql+psycopg://eudamed:eudamed@db:5432/eudamed
      EUDAMED_OUTPUT_DIR: /srv/eudamed/output
      EUDAMED_PROFILE: ${EUDAMED_PROFILE:-as-consult}
    volumes:
      - ./output:/srv/eudamed/output
      - ./backups:/srv/eudamed/backups
    ports:
      - "8091:8000"  # playground app (production uses 8090)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
