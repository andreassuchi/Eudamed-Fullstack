services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eudamed
      POSTGRES_PASSWORD: eudamed
      POSTGRES_DB: eudamed
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudamed"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EUDAMED_DATABASE_URL: postgresql+psycopg://eudamed:eudamed@db:5432/eudamed
      EUDAMED_OUTPUT_DIR: /srv/eudamed/output
    volumes:
      - ./output:/srv/eudamed/output
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
