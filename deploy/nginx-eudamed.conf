# Host nginx server block for the EUDAMED Upload subdomain.
#
# Install on the VPS as:  /etc/nginx/sites-available/eudamed
# then symlink into sites-enabled and let certbot add the TLS/443 part.
# See DEPLOY.md for the full procedure.
#
# Replace eudamed.example.com with your real subdomain before use.

server {
    listen 80;
    listen [::]:80;
    server_name eudamed.example.com;

    # The app has no login of its own -> protect it with HTTP basic-auth.
    # Create the password file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-eudamed <username>
    auth_basic           "EUDAMED Upload";
    auth_basic_user_file /etc/nginx/.htpasswd-eudamed;

    # Excel workbooks and EUDAMED response XML can exceed nginx's 1 MB default.
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:8090;   # must match APP_PORT in .env.prod
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # XML generation / XSD validation can take a moment
    }
}

# After `sudo certbot --nginx -d eudamed.example.com` runs, certbot rewrites this
# file: it adds a `listen 443 ssl` server (with the cert paths + your auth_basic
# and proxy settings copied in) and turns this port-80 block into an HTTP->HTTPS
# redirect. You normally don't edit the 443 block by hand.
